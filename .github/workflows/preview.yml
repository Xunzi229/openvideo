name: Preview APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the signed APKs as a GitHub prerelease"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - "codex/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build preview APK
    runs-on: windows-latest
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      OPENVIDEO_SOURCES_NAV_ENABLED: ${{ vars.OPENVIDEO_SOURCES_NAV_ENABLED || 'false' }}
      OPENVIDEO_RELEASE_STORE_PASSWORD: ${{ secrets.OPENVIDEO_RELEASE_STORE_PASSWORD }}
      OPENVIDEO_RELEASE_KEY_ALIAS: ${{ secrets.OPENVIDEO_RELEASE_KEY_ALIAS }}
      OPENVIDEO_RELEASE_KEY_PASSWORD: ${{ secrets.OPENVIDEO_RELEASE_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.OPENVIDEO_RELEASE_KEYSTORE_BASE64 }}
      EXPECTED_RELEASE_CERT_SHA256: ${{ vars.OPENVIDEO_RELEASE_CERT_SHA256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate preview signing configuration
        shell: pwsh
        run: |
          $required = @(
            "KEYSTORE_BASE64",
            "OPENVIDEO_RELEASE_STORE_PASSWORD",
            "OPENVIDEO_RELEASE_KEY_ALIAS",
            "OPENVIDEO_RELEASE_KEY_PASSWORD",
            "EXPECTED_RELEASE_CERT_SHA256"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions signing configuration: $name"
            }
          }
          if ($env:EXPECTED_RELEASE_CERT_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw "OPENVIDEO_RELEASE_CERT_SHA256 must be a 64-character SHA-256 fingerprint."
          }

      - name: Restore release keystore
        shell: pwsh
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP "openvideo-release.jks"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "OPENVIDEO_RELEASE_STORE_FILE=$keystorePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run full unit tests and coverage
        run: .\gradlew.bat :app:testDebugUnitTest :app:createDebugUnitTestCoverageReport

      - name: Enforce business coverage
        shell: pwsh
        run: .\scripts\Test-BusinessCoverage.ps1

      - name: Publish coverage summary
        if: always()
        shell: pwsh
        run: |
          $summary = "app/build/reports/coverage/business/summary.md"
          if (Test-Path $summary) {
            Get-Content $summary | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-test-coverage
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/coverage/test/debug/report.xml
            app/build/reports/coverage/business
          if-no-files-found: warn

      - name: Build preview APKs
        run: .\gradlew.bat :app:assembleRelease -POPENVIDEO_ABI_SPLITS=true

      - name: Verify and stage preview APKs
        shell: pwsh
        run: |
          $apkDir = "app/build/outputs/apk/release"
          if (-not (Test-Path $apkDir)) {
            throw "Signed preview APK directory was not produced: $apkDir"
          }
          $apks = @(Get-ChildItem $apkDir -Filter "*.apk")
          if ($apks.Count -eq 0) {
            throw "Signed preview APKs were not produced under $apkDir"
          }

          function Get-AbiLabel([string] $name) {
            if ($name -match 'arm64-v8a') { return 'arm64-v8a' }
            if ($name -match 'armeabi-v7a') { return 'armeabi-v7a' }
            if ($name -match 'x86_64') { return 'x86_64' }
            if ($name -match 'x86') { return 'x86' }
            return 'universal'
          }

          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_SDK_ROOT "build-tools") -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          $apksigner = Join-Path $buildTools.FullName "apksigner.bat"
          New-Item -ItemType Directory -Path preview -Force | Out-Null
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $labels = @()
          foreach ($apk in $apks) {
            $verifyOutput = & $apksigner verify --verbose --print-certs $apk.FullName 2>&1
            $verifyOutput | Write-Host
            if ($LASTEXITCODE -ne 0) {
              throw "Preview APK signature verification failed: $($apk.Name)"
            }

            $certMatch = [regex]::Match(($verifyOutput -join "`n"), 'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})')
            if (-not $certMatch.Success) {
              throw "Could not read the APK signing certificate SHA-256 fingerprint: $($apk.Name)"
            }
            $actual = $certMatch.Groups[1].Value.ToLowerInvariant()
            $expected = $env:EXPECTED_RELEASE_CERT_SHA256.Trim().ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Preview signing certificate mismatch. Expected $expected, got $actual."
            }

            $label = Get-AbiLabel $apk.Name
            Copy-Item $apk.FullName "preview/openvideo-preview-$shortSha-$label.apk"
            $labels += $label
          }

          foreach ($need in @('armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64', 'universal')) {
            if ($labels -notcontains $need) {
              throw "Missing ABI preview APK: $need"
            }
          }

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: openvideo-preview-${{ github.sha }}
          path: preview/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            throw "Preview workflow must run from a branch commit."
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $releaseTag = "preview-$shortSha"
          $versionLine = Get-Content gradle.properties | Where-Object { $_ -match '^VERSION_NAME=' } | Select-Object -First 1
          $versionName = ($versionLine -split '=', 2)[1].Trim()
          if ([string]::IsNullOrWhiteSpace($versionName)) {
            throw "VERSION_NAME is missing from gradle.properties."
          }
          $apkFiles = @(Get-ChildItem preview -Filter "*.apk" | ForEach-Object { $_.FullName })
          if ($apkFiles.Count -eq 0) {
            throw "No preview APKs were staged."
          }

          $notes = @"
          Preview v$versionName from main commit $shortSha.

          The APKs use the same official OpenVideo signing certificate as production releases. This is a prerelease build intended for compatibility testing and may be less stable than the latest production release.
          "@
          $arguments = @(
            "release", "create", $releaseTag
          ) + $apkFiles + @(
            "--target", $env:GITHUB_SHA,
            "--title", "Open Video v$versionName Preview",
            "--notes", $notes,
            "--prerelease"
          )
          & gh @arguments

      - name: Announce preview outputs
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release || 'false' }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            throw "Preview workflow must not run on tags."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:PUBLISH_RELEASE -eq 'true') {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            gh release view "preview-$shortSha" --repo $env:GITHUB_REPOSITORY
            exit 0
          }
          gh run view $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY
          Write-Host "Download preview APKs without a GitHub Release:"
          Write-Host "gh run download $env:GITHUB_RUN_ID -n openvideo-preview-$env:GITHUB_SHA -D ."
