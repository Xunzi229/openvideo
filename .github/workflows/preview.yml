name: Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build preview APK
    runs-on: windows-latest
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      OPENVIDEO_SOURCES_NAV_ENABLED: ${{ vars.OPENVIDEO_SOURCES_NAV_ENABLED || 'false' }}
      OPENVIDEO_RELEASE_STORE_PASSWORD: ${{ secrets.OPENVIDEO_RELEASE_STORE_PASSWORD }}
      OPENVIDEO_RELEASE_KEY_ALIAS: ${{ secrets.OPENVIDEO_RELEASE_KEY_ALIAS }}
      OPENVIDEO_RELEASE_KEY_PASSWORD: ${{ secrets.OPENVIDEO_RELEASE_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.OPENVIDEO_RELEASE_KEYSTORE_BASE64 }}
      EXPECTED_RELEASE_CERT_SHA256: ${{ vars.OPENVIDEO_RELEASE_CERT_SHA256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate preview signing configuration
        shell: pwsh
        run: |
          $required = @(
            "KEYSTORE_BASE64",
            "OPENVIDEO_RELEASE_STORE_PASSWORD",
            "OPENVIDEO_RELEASE_KEY_ALIAS",
            "OPENVIDEO_RELEASE_KEY_PASSWORD",
            "EXPECTED_RELEASE_CERT_SHA256"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions signing configuration: $name"
            }
          }
          if ($env:EXPECTED_RELEASE_CERT_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw "OPENVIDEO_RELEASE_CERT_SHA256 must be a 64-character SHA-256 fingerprint."
          }

      - name: Restore release keystore
        shell: pwsh
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP "openvideo-release.jks"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "OPENVIDEO_RELEASE_STORE_FILE=$keystorePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run preview regression tests
        run: >-
          .\gradlew.bat :app:testDebugUnitTest
          --tests "com.example.openvideo.ui.player.PlayerErrorPresentationPolicyTest"
          --tests "com.example.openvideo.ui.player.PlayerLifecyclePolicyTest"
          --tests "com.example.openvideo.ui.player.PlayerErrorDiagnosticsSourceTest"
          --tests "com.example.openvideo.core.diagnostics.CrashRedactionPolicyTest"
          --tests "com.example.openvideo.core.diagnostics.CrashLoggerSourceTest"
          --tests "com.example.openvideo.core.diagnostics.CrashReportOutboxSourceTest"
          --tests "com.example.openvideo.ui.settings.SettingsCrashReportingSourceTest"
          --tests "com.example.openvideo.core.update.GitHubReleaseCheckerTest"
          --tests "com.example.openvideo.core.update.GitHubAbiSelectionTest"
          --tests "com.example.openvideo.core.ui.SystemBarInsetsPolicyTest"
          --tests "com.example.openvideo.core.ui.OverlayInsetsSourceTest"
          --tests "com.example.openvideo.core.ui.AppleStyleAndSizeSourceTest"
          --tests "com.example.openvideo.ui.home.HomeSearchFilterSourceTest"
          --tests "com.example.openvideo.core.update.UpdateUrlPolicyTest"
          --tests "com.example.openvideo.core.network.NetworkUrlPolicyTest"
          --tests "com.example.openvideo.core.network.NetworkSharedUrlPolicyTest"
          --tests "com.example.openvideo.core.network.WebDavConnectionPolicyTest"
          --tests "com.example.openvideo.core.network.WebDavDirectoryParserTest"
          --tests "com.example.openvideo.core.network.WebDavErrorHandlingSourceTest"
          --tests "com.example.openvideo.data.scanner.MediaStoreDiffPolicyTest"
          --tests "com.example.openvideo.data.scanner.MediaStorePathPolicyTest"
          --tests "com.example.openvideo.data.scanner.VideoScannerCacheSourceTest"
          --tests "com.example.openvideo.data.repository.VideoRepositoryMediaIdentitySourceTest"
          --tests "com.example.openvideo.ui.home.MediaLibraryPolicyTest"
          --tests "com.example.openvideo.ui.home.MediaLibrarySearchPolicyTest"
          --tests "com.example.openvideo.ui.local.VideoFolderGrouperTest"
          --tests "com.example.openvideo.ui.local.LocalContinuePlaybackSourceTest"
          --tests "com.example.openvideo.ui.player.PlayerEpisodeOrderingPolicyTest"
          --tests "com.example.openvideo.ui.privacy.PrivacyPathPolicyTest"
          --tests "com.example.openvideo.ui.privacy.PrivacyPasswordPolicyTest"
          --tests "com.example.openvideo.ui.privacy.PrivacyIntegrationSourceTest"
          --tests "com.example.openvideo.security.AppDataBackupPolicySourceTest"
          --tests "com.example.openvideo.build.ReleaseEngineeringSourceTest.githubPreviewWorkflowBuildsAndUploadsSignedReleaseApk"
          --tests "com.example.openvideo.build.ReleaseEngineeringSourceTest.githubReleaseWorkflowRestoresSigningKeyAndPublishesSignedApk"
          --tests "com.example.openvideo.build.ReleaseEngineeringSourceTest.localSigningWrapperDoesNotContainSigningPasswords"
          --tests "com.example.openvideo.build.ReleaseEngineeringSourceTest.agentRulesRequireOfficialReleaseSigningOnCiPackaging"
          --tests "com.example.openvideo.build.FeaturePackagingBuildConfigTest"
          --tests "com.example.openvideo.ui.sources.SourcesInformationArchitectureSourceTest"

      - name: Build preview APKs
        run: .\gradlew.bat :app:assembleRelease -POPENVIDEO_ABI_SPLITS=true

      - name: Verify and stage preview APKs
        shell: pwsh
        run: |
          $apkDir = "app/build/outputs/apk/release"
          if (-not (Test-Path $apkDir)) {
            throw "Signed preview APK directory was not produced: $apkDir"
          }
          $apks = @(Get-ChildItem $apkDir -Filter "*.apk")
          if ($apks.Count -eq 0) {
            throw "Signed preview APKs were not produced under $apkDir"
          }

          function Get-AbiLabel([string] $name) {
            if ($name -match 'arm64-v8a') { return 'arm64-v8a' }
            if ($name -match 'armeabi-v7a') { return 'armeabi-v7a' }
            if ($name -match 'x86_64') { return 'x86_64' }
            if ($name -match 'x86') { return 'x86' }
            return 'universal'
          }

          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_SDK_ROOT "build-tools") -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          $apksigner = Join-Path $buildTools.FullName "apksigner.bat"
          New-Item -ItemType Directory -Path preview -Force | Out-Null
          $labels = @()
          foreach ($apk in $apks) {
            $verifyOutput = & $apksigner verify --verbose --print-certs $apk.FullName 2>&1
            $verifyOutput | Write-Host
            if ($LASTEXITCODE -ne 0) {
              throw "Preview APK signature verification failed: $($apk.Name)"
            }

            $certMatch = [regex]::Match(($verifyOutput -join "`n"), 'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})')
            if (-not $certMatch.Success) {
              throw "Could not read the APK signing certificate SHA-256 fingerprint: $($apk.Name)"
            }
            $actual = $certMatch.Groups[1].Value.ToLowerInvariant()
            $expected = $env:EXPECTED_RELEASE_CERT_SHA256.Trim().ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Preview signing certificate mismatch. Expected $expected, got $actual."
            }

            $label = Get-AbiLabel $apk.Name
            Copy-Item $apk.FullName "preview/openvideo-preview-$env:GITHUB_SHA-$label.apk"
            $labels += $label
          }

          foreach ($need in @('armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64', 'universal')) {
            if ($labels -notcontains $need) {
              throw "Missing ABI preview APK: $need"
            }
          }

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: openvideo-preview-${{ github.sha }}
          path: preview/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Announce preview APKs with gh without publishing a release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            throw "Preview workflow must not run on tags or publish a GitHub Release."
          }
          gh run view $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY
          Write-Host "Download preview APKs without a GitHub Release:"
          Write-Host "gh run download $env:GITHUB_RUN_ID -n openvideo-preview-$env:GITHUB_SHA -D ."
