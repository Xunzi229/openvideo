name: Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build preview APK
    runs-on: windows-latest
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      OPENVIDEO_SOURCES_NAV_ENABLED: ${{ vars.OPENVIDEO_SOURCES_NAV_ENABLED || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run preview regression tests
        run: >-
          .\gradlew.bat :app:testDebugUnitTest
          --tests "com.example.openvideo.ui.player.PlayerErrorPresentationPolicyTest"
          --tests "com.example.openvideo.data.scanner.VideoScannerCacheSourceTest"
          --tests "com.example.openvideo.build.ReleaseEngineeringSourceTest.githubPreviewWorkflowBuildsAndUploadsDebugApk"
          --tests "com.example.openvideo.build.ReleaseEngineeringSourceTest.githubReleaseWorkflowRestoresSigningKeyAndPublishesSignedApk"
          --tests "com.example.openvideo.build.ReleaseEngineeringSourceTest.localSigningWrapperDoesNotContainSigningPasswords"
          --tests "com.example.openvideo.build.FeaturePackagingBuildConfigTest"
          --tests "com.example.openvideo.ui.sources.SourcesInformationArchitectureSourceTest"

      - name: Build preview APK
        run: .\gradlew.bat :app:assembleDebug

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: openvideo-preview-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
