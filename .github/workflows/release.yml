name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.0.17"
        required: true
        type: string
      publish_release:
        description: "Create the GitHub Release after building"
        required: true
        default: false
        type: boolean
      replace_existing_release:
        description: "Replace an existing GitHub Release and tag after verification"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed release APK
    runs-on: windows-latest
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      OPENVIDEO_RELEASE_STORE_PASSWORD: ${{ secrets.OPENVIDEO_RELEASE_STORE_PASSWORD }}
      OPENVIDEO_RELEASE_KEY_ALIAS: ${{ secrets.OPENVIDEO_RELEASE_KEY_ALIAS }}
      OPENVIDEO_RELEASE_KEY_PASSWORD: ${{ secrets.OPENVIDEO_RELEASE_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.OPENVIDEO_RELEASE_KEYSTORE_BASE64 }}
      MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
      OPENVIDEO_SOURCES_NAV_ENABLED: ${{ vars.OPENVIDEO_SOURCES_NAV_ENABLED || 'false' }}
      REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}
      EXPECTED_RELEASE_CERT_SHA256: ${{ vars.OPENVIDEO_RELEASE_CERT_SHA256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate release tag and signing secrets
        shell: pwsh
        run: |
          $required = @(
            "KEYSTORE_BASE64",
            "FEISHU_WEBHOOK_URL",
            "OPENVIDEO_RELEASE_STORE_PASSWORD",
            "OPENVIDEO_RELEASE_KEY_ALIAS",
            "OPENVIDEO_RELEASE_KEY_PASSWORD",
            "EXPECTED_RELEASE_CERT_SHA256"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions secret: $name"
            }
          }
          if ($env:EXPECTED_RELEASE_CERT_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw "OPENVIDEO_RELEASE_CERT_SHA256 must be a 64-character SHA-256 fingerprint."
          }

          $properties = Get-Content gradle.properties -Raw
          $versionMatch = [regex]::Match($properties, '(?m)^VERSION_NAME\s*=\s*(.+?)\s*$')
          if (-not $versionMatch.Success) {
            throw "VERSION_NAME is missing from gradle.properties"
          }

          $versionName = $versionMatch.Groups[1].Value.Trim()
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:MANUAL_RELEASE_TAG }
          if ($releaseTag -ne "v$versionName") {
            throw "Release tag '$releaseTag' must match VERSION_NAME '$versionName' (expected v$versionName)."
          }

          "RELEASE_TAG=$releaseTag" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$versionName" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore release keystore
        shell: pwsh
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP "openvideo-release.jks"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "OPENVIDEO_RELEASE_STORE_FILE=$keystorePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run feature packaging regression tests
        run: >-
          .\gradlew.bat :app:testDebugUnitTest
          --tests "com.example.openvideo.build.AppNameLocalizationSourceTest"
          --tests "com.example.openvideo.build.ReleaseEngineeringSourceTest.githubReleaseWorkflowRestoresSigningKeyAndPublishesSignedApk"
          --tests "com.example.openvideo.build.FeaturePackagingBuildConfigTest"
          --tests "com.example.openvideo.ui.sources.SourcesInformationArchitectureSourceTest"

      - name: Build signed release APKs
        run: .\gradlew.bat :app:assembleRelease -POPENVIDEO_ABI_SPLITS=true

      - name: Verify and stage release artifacts
        shell: pwsh
        run: |
          $apkDir = "app/build/outputs/apk/release"
          if (-not (Test-Path $apkDir)) {
            throw "Signed release APK directory was not produced: $apkDir"
          }
          $apks = @(Get-ChildItem $apkDir -Filter "*.apk")
          if ($apks.Count -eq 0) {
            throw "Signed release APKs were not produced: $apkDir"
          }

          function Get-AbiLabel([string] $name) {
            if ($name -match 'arm64-v8a') { return 'arm64-v8a' }
            if ($name -match 'armeabi-v7a') { return 'armeabi-v7a' }
            if ($name -match 'x86_64') { return 'x86_64' }
            if ($name -match 'x86') { return 'x86' }
            return 'universal'
          }

          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_SDK_ROOT "build-tools") -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          $apksigner = Join-Path $buildTools.FullName "apksigner.bat"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $labels = @()
          foreach ($apk in $apks) {
            $verifyOutput = & $apksigner verify --verbose --print-certs $apk.FullName 2>&1
            $verifyOutput | Write-Host
            if ($LASTEXITCODE -ne 0) {
              throw "APK signature verification failed: $($apk.Name)"
            }

            $certMatch = [regex]::Match(($verifyOutput -join "`n"), 'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})')
            if (-not $certMatch.Success) {
              throw "Could not read the APK signing certificate SHA-256 fingerprint: $($apk.Name)"
            }
            $actual = $certMatch.Groups[1].Value.ToLowerInvariant()
            $expected = $env:EXPECTED_RELEASE_CERT_SHA256.Trim().ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Release signing certificate mismatch. Expected $expected, got $actual."
            }

            $label = Get-AbiLabel $apk.Name
            Copy-Item $apk.FullName (Join-Path release "openvideo-$env:RELEASE_TAG-$label.apk")
            $labels += $label
          }

          foreach ($need in @('armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64', 'universal')) {
            if ($labels -notcontains $need) {
              throw "Missing ABI release APK: $need"
            }
          }

          $hashLines = Get-ChildItem release -Filter "*.apk" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashLines | Set-Content release/SHA256SUMS.txt -Encoding utf8

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvideo-${{ env.RELEASE_TAG }}-signed
          path: |
            release/*.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apkFiles = @(Get-ChildItem release -Filter "*.apk" | ForEach-Object { $_.FullName })
          if ($apkFiles.Count -eq 0) {
            throw "No release APKs were staged."
          }
          if ($env:REPLACE_EXISTING_RELEASE -eq "true") {
            & gh release view $env:RELEASE_TAG *> $null
            if ($LASTEXITCODE -eq 0) {
              & gh release delete $env:RELEASE_TAG --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to remove existing release $env:RELEASE_TAG."
              }
            }

            & git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" *> $null
            if ($LASTEXITCODE -eq 0) {
              & git push origin --delete $env:RELEASE_TAG
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to remove existing tag $env:RELEASE_TAG."
              }
            }
          }
          $arguments = @(
            "release", "create", $env:RELEASE_TAG
          ) + $apkFiles + @(
            (Resolve-Path "release/SHA256SUMS.txt").Path,
            "--title", "Open Video $env:RELEASE_TAG",
            "--generate-notes"
          )
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $arguments += "--verify-tag"
          } else {
            $arguments += @("--target", $env:GITHUB_SHA)
          }
          & gh @arguments
